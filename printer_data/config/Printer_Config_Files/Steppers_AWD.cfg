#####################################################################
#   X/Y Stepper Settings - Monolith AWD
#   OMC 17HS19-2504S-H-V1
#   1.8 degree, 2.5 A/phase
#####################################################################

#####################################################################
#   B Stepper - MOTOR_0
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 351
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: False
run_current: 1.10
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   A Stepper - MOTOR_1
#####################################################################

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG6
position_min: 0
position_endstop: 350
position_max: 351
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: False
run_current: 1.10
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Second B Stepper - MOTOR_5
#####################################################################

[stepper_x1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_x1]
uart_pin: PE4
interpolate: False
run_current: 1.10
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Second A Stepper - MOTOR_6
#####################################################################

[stepper_y1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc2209 stepper_y1]
uart_pin: PE1
interpolate: False
run_current: 1.10
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

#####################################################################
#   Z0 Stepper - Front Left
#   Connected to MOTOR_2
#####################################################################

[stepper_z]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2

rotation_distance: 4
microsteps: 32

endstop_pin: probe:z_virtual_endstop

position_max: 250
position_min: -5

homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0


[tmc2209 stepper_z]
uart_pin: PF2
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Z1 Stepper - Rear Center
#   Connected to MOTOR_3
#####################################################################

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0

rotation_distance: 4
microsteps: 32


[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Z2 Stepper - Front Right
#   Connected to MOTOR_4
#####################################################################

[stepper_z2]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5

rotation_distance: 4
microsteps: 32


[tmc2209 stepper_z2]
uart_pin: PC6
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Additional Stepper
#   Connected to MOTOR_7
#####################################################################

[manual_stepper additional_testing_dummy]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0

rotation_distance: 22.875
microsteps: 16


[tmc2209 manual_stepper additional_testing_dummy]
uart_pin: PD3
interpolate: False
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 999999
